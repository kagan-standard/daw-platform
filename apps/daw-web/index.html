<!DOCTYPE html>
<html lang="en">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b0e1a; --bg-card: #111627; --bg-card-alt: #0f1322;
    --gold: #f5b731; --gold-dim: #c4922a;
    --gold-glow: rgba(245,183,49,0.15);
    --text: #e8e6e1; --text-dim: #8a8b94;
    --input-bg: #181d30; --input-border: #2a2f45;
    --error: #e74c3c; --success: #2ecc71;
  }
  html, body { height: 100%; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; overflow-y: auto; }
  #stars-canvas { position: fixed; inset: 0; z-index: 0; }
  .cityscape { position: fixed; bottom: 0; left: 0; right: 0; height: 400px; z-index: 1; pointer-events: none; }
  .cityscape svg { width: 100%; height: 100%; }
  .page { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px 20px 40px; }

  .logo-area { margin-bottom: 24px; text-align: center; animation: fadeDown 0.8s ease-out; }
  .logo-area img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--gold); box-shadow: 0 0 30px var(--gold-glow); object-fit: cover; }
  .site-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 4px; color: var(--gold); margin-top: 12px; text-shadow: 0 0 20px var(--gold-glow); }
  .tagline { font-size: 14px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.5px; }

  .card-wrapper { position: relative; width: 440px; max-width: 100%; animation: fadeUp 0.8s ease-out 0.2s both; }
  .card-base { background: var(--bg-card); border: 1px solid var(--input-border); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px var(--gold-glow); transition: opacity 0.5s, transform 0.5s; }
  .card-hidden { opacity: 0; transform: scale(0.95) translateY(-10px); pointer-events: none; position: absolute; width: 100%; top: 0; }
  .card-visible { opacity: 1; transform: scale(1) translateY(0); pointer-events: all; position: relative; }

  .front-door-pad { padding: 32px; text-align: center; }
  .service-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
  .service-card { display: flex; align-items: center; gap: 16px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px; padding: 18px 20px; transition: all 0.3s; text-align: left; }
  .service-card a { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
  .service-card.live { cursor: pointer; }
  .service-card.live:hover { border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow); transform: translateX(4px); background: rgba(245,183,49,0.05); }
  .service-card.coming-soon { opacity: 0.6; cursor: default; }
  .service-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .service-icon.beer { background: rgba(245,183,49,0.15); color: var(--gold); }
  .service-icon.chat { background: #6c5ce722; color: #6c5ce7; }
  .service-icon.football { background: rgba(46,204,113,0.12); color: #2ecc71; }
  .service-info { flex: 1; min-width: 0; }
  .service-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1.5px; margin-bottom: 2px; }
  .service-desc { font-size: 12px; color: var(--text-dim); }
  .service-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
  .badge-live { background: rgba(46,204,113,0.2); color: var(--success); }
  .badge-soon { background: #ffffff11; color: var(--text-dim); }
  .service-arrow { color: var(--text-dim); font-size: 18px; transition: color 0.3s, transform 0.3s; flex-shrink: 0; }
  .service-card.live:hover .service-arrow { color: var(--gold); transform: translateX(3px); }

  .auth-buttons { display: flex; flex-direction: column; gap: 12px; }
  .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; cursor: pointer; transition: all 0.3s; text-decoration: none; text-align: center; display: inline-block; box-sizing: border-box; }
  .btn-gold { background: var(--gold); color: var(--bg); }
  .btn-gold:hover { background: var(--gold-dim); box-shadow: 0 4px 20px var(--gold-glow); transform: translateY(-1px); }
  .btn-outline { background: transparent; color: var(--gold); border: 2px solid var(--gold); }
  .btn-outline:hover { background: rgba(245,183,49,0.1); }
  .status-msg { text-align: center; font-size: 13px; margin-top: 12px; min-height: 20px; color: var(--error); }

  .launcher-pad { padding: 32px; text-align: center; }
  .user-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
  .user-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
  .user-avatar.initials { display: flex; align-items: center; justify-content: center; background: rgba(245,183,49,0.2); color: var(--gold); font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; }
  .user-greeting { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 3px; color: var(--gold); }
  .launcher-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; }
  .card-footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--input-border); text-align: center; }
  .card-signout { font-size: 13px; color: var(--gold); cursor: pointer; transition: all 0.2s; background: none; border: 1px solid var(--gold); border-radius: 8px; padding: 8px 20px; font-family: 'Outfit', sans-serif; }
  .card-signout:hover { background: var(--gold); color: var(--bg); }
  .web-chat-hint { margin-top: 16px; font-size: 14px; color: var(--text-dim); opacity: 0.6; line-height: 1.5; }
  .web-chat-hint a { color: var(--gold); text-decoration: underline; text-decoration-style: dotted; transition: color 0.2s; }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 480px) {
    .card-wrapper { width: 100%; }
    .front-door-pad, .launcher-pad { padding: 24px 20px; }
    .site-title { font-size: 26px; }
    .cityscape { height: 260px; }
    .service-card { padding: 14px 16px; }
  }
  @media (min-width: 360px) and (max-width: 480px) {
    .service-grid { gap: 12px; }
  }
</style>

<div class="page">
  <div class="logo-area">
    <img src="logo.jpg" alt="Drinks After Work">
    <div class="site-title">Drinks After Work</div>
    <div class="tagline">Where the crew links up</div>
  </div>

  <div class="card-wrapper">
    <!-- Logged-out: service cards + Sign in / Create Account -->
    <div class="card-base card-visible" id="logged-out-card">
      <div class="front-door-pad">
        <div class="service-grid" id="logged-out-services"></div>
        <div class="auth-buttons">
          <button type="button" class="btn btn-gold" id="btn-signin" onclick="startLogin()">Sign in with DAW</button>
          <button type="button" class="btn btn-outline" id="btn-register" onclick="startRegistration()">Create Account</button>
        </div>
        <div class="status-msg" id="auth-status"></div>
      </div>
    </div>

    <!-- Logged-in: greeting + avatar + service cards + Sign out -->
    <div class="card-base card-hidden" id="logged-in-card">
      <div class="launcher-pad">
        <div class="user-bar">
          <div id="user-avatar-wrap"></div>
          <div class="user-greeting" id="logged-in-greeting">Welcome</div>
        </div>
        <div class="launcher-sub">Where do you want to go?</div>
        <div class="service-grid" id="logged-in-services"></div>
        <div class="card-footer">
          <button class="card-signout" onclick="signOut()">Sign out</button>
          <div class="web-chat-hint">Web chat: <a href="https://element.drinksafterwork.net" target="_blank" rel="noopener">Element</a></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var DAW = window.DAW_CONFIG || {};
  var authority = (DAW.keycloak && DAW.keycloak.authority) ? DAW.keycloak.authority.replace(/\/+$/, '') : '';
  var clientId = (DAW.keycloak && DAW.keycloak.clientId) ? DAW.keycloak.clientId : 'daw-web';
  var redirectUri = window.location.origin + (window.location.pathname || '/');
  var services = Array.isArray(DAW.services) ? DAW.services : [];

  var oidc = {
    authEndpoint: '',
    tokenEndpoint: '',
    userinfoEndpoint: '',
    endSessionEndpoint: ''
  };

  function storageGet(key, fallback) {
    try {
      var raw = sessionStorage.getItem('daw_oidc_' + key);
      return raw ? JSON.parse(raw) : (fallback !== undefined ? fallback : null);
    } catch (e) { return fallback !== undefined ? fallback : null; }
  }
  function storageSet(key, val) {
    try { sessionStorage.setItem('daw_oidc_' + key, JSON.stringify(val)); } catch (e) {}
  }
  function storageRemove(key) {
    sessionStorage.removeItem('daw_oidc_' + key);
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
  }

  function setAuthStatus(msg, isError) {
    var el = document.getElementById('auth-status');
    if (el) { el.textContent = msg || ''; el.style.color = isError ? 'var(--error)' : 'var(--text-dim)'; }
  }

  function renderServiceCard(containerId, loggedIn) {
    var container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    var iconMap = { beer: 'beer', chat: 'chat', football: 'football' };
    services.forEach(function(s) {
      var isLive = (s.status || '').toLowerCase() === 'live';
      var card = document.createElement('div');
      card.className = 'service-card ' + (isLive ? 'live' : 'coming-soon');
      var iconClass = iconMap[s.icon] || 'beer';
      if (isLive) {
        var a = document.createElement('a');
        a.href = s.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = '<div class="service-icon ' + iconClass + '">' + (s.icon === 'beer' ? '🍺' : s.icon === 'chat' ? '💬' : '🏈') + '</div>' +
          '<div class="service-info"><div class="service-name">' + escapeHtml(s.name) + '</div><div class="service-desc">' + escapeHtml(s.desc || '') + '</div></div>' +
          '<span class="service-badge badge-live">Live</span><span class="service-arrow">→</span>';
        card.appendChild(a);
      } else {
        card.innerHTML = '<div class="service-icon ' + iconClass + '">' + (s.icon === 'football' ? '🏈' : '🍺') + '</div>' +
          '<div class="service-info"><div class="service-name">' + escapeHtml(s.name) + '</div><div class="service-desc">' + escapeHtml(s.desc || '') + '</div></div>' +
          '<span class="service-badge badge-soon">Coming Soon</span>';
      }
      container.appendChild(card);
    });
  }
  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showCard(id) {
    var out = document.getElementById('logged-out-card');
    var in_ = document.getElementById('logged-in-card');
    if (id === 'logged-in-card') {
      if (out) { out.classList.add('card-hidden'); out.classList.remove('card-visible'); }
      if (in_) { in_.classList.remove('card-hidden'); in_.classList.add('card-visible'); }
    } else {
      if (out) { out.classList.remove('card-hidden'); out.classList.add('card-visible'); }
      if (in_) { in_.classList.add('card-hidden'); in_.classList.remove('card-visible'); }
    }
  }

  function showLoggedIn(user) {
    var greeting = document.getElementById('logged-in-greeting');
    var avatarWrap = document.getElementById('user-avatar-wrap');
    if (greeting) greeting.textContent = 'Welcome, ' + (user.display_name || user.email || 'Member');
    if (avatarWrap) {
      if (user.picture) {
        avatarWrap.innerHTML = '<img class="user-avatar" src="' + escapeHtml(user.picture) + '" alt="">';
      } else {
        var initials = (user.display_name || user.email || 'U').split(/[\s@]/).map(function(w) { return w[0]; }).join('').toUpperCase().slice(0, 2) || 'U';
        avatarWrap.innerHTML = '<div class="user-avatar initials">' + escapeHtml(initials) + '</div>';
      }
    }
    showCard('logged-in-card');
  }

  function generatePKCE() {
    var array = new Uint8Array(32);
    crypto.getRandomValues(array);
    var verifier = btoa(String.fromCharCode.apply(null, array)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return Promise.all([
      Promise.resolve(verifier),
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)).then(function(hash) {
        return btoa(String.fromCharCode.apply(null, new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      })
    ]).then(function(arr) { return { verifier: arr[0], challenge: arr[1] }; });
  }

  function discoverOIDC() {
    if (oidc.authEndpoint) return Promise.resolve(true);
    if (!authority) return Promise.resolve(false);
    return fetch(authority + '/.well-known/openid-configuration')
      .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('Discovery failed')); })
      .then(function(cfg) {
        oidc.authEndpoint = cfg.authorization_endpoint;
        oidc.tokenEndpoint = cfg.token_endpoint;
        oidc.userinfoEndpoint = cfg.userinfo_endpoint;
        oidc.endSessionEndpoint = cfg.end_session_endpoint;
        return true;
      })
      .catch(function(e) { console.warn('OIDC discovery failed:', e); return false; });
  }

  window.startLogin = function() {
    discoverOIDC().then(function(ok) {
      if (!ok) { setAuthStatus('Cannot connect to Keycloak.', true); return; }
      generatePKCE().then(function(pkce) {
        var state = uid();
        storageSet('verifier', pkce.verifier);
        storageSet('state', state);
        var params = new URLSearchParams({
          response_type: 'code',
          client_id: clientId,
          redirect_uri: redirectUri,
          scope: 'openid profile email',
          state: state,
          code_challenge: pkce.challenge,
          code_challenge_method: 'S256'
        });
        window.location.href = oidc.authEndpoint + '?' + params;
      });
    });
  };

  window.startRegistration = function() {
    discoverOIDC().then(function(ok) {
      if (!ok) { setAuthStatus('Cannot connect to Keycloak.', true); return; }
      generatePKCE().then(function(pkce) {
        var state = uid();
        storageSet('verifier', pkce.verifier);
        storageSet('state', state);
        var params = new URLSearchParams({
          response_type: 'code',
          client_id: clientId,
          redirect_uri: redirectUri,
          scope: 'openid profile email',
          state: state,
          code_challenge: pkce.challenge,
          code_challenge_method: 'S256'
        });
        window.location.href = oidc.authEndpoint + '?' + params + '&kc_action=register';
      });
    });
  };

  function getUserInfo(accessToken) {
    if (!oidc.userinfoEndpoint) return Promise.reject(new Error('No userinfo endpoint'));
    return fetch(oidc.userinfoEndpoint, { headers: { 'Authorization': 'Bearer ' + accessToken } })
      .then(function(r) {
        if (!r.ok) throw new Error('Failed to fetch user info');
        return r.json();
      })
      .then(function(info) {
        return {
          id: info.sub,
          email: info.email || '',
          display_name: info.preferred_username || info.name || (info.email ? info.email.split('@')[0] : 'Member'),
          name: info.name || '',
          picture: info.picture || null
        };
      });
  }

  function handleCallback() {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var state = params.get('state');
    var error = params.get('error');

    // Handle errors from Keycloak
    if (error) {
      window.history.replaceState({}, '', redirectUri);
      // 'login_required' and 'interaction_required' are expected from prompt=none
      // Don't show an error for these — just silently show the login screen
      if (error === 'login_required' || error === 'interaction_required') {
        storageRemove('verifier');
        storageRemove('state');
        return Promise.resolve(null);
      }
      setAuthStatus('Login error: ' + (params.get('error_description') || error), true);
      return Promise.resolve(null);
    }

    // No code in URL = not an OIDC callback, nothing to do
    if (!code) return Promise.resolve(null);

    // Validate state — but if state is missing/mismatched, just clean up
    // instead of showing a scary error. This happens when:
    //   - User opened verification link in a different tab
    //   - sessionStorage was cleared between registration and callback
    //   - prompt=none redirect and state expired
    var savedState = storageGet('state');
    var verifier = storageGet('verifier');

    if (!state || !savedState || state !== savedState || !verifier) {
      storageRemove('verifier');
      storageRemove('state');
      window.history.replaceState({}, '', redirectUri);
      return Promise.resolve(null);
    }

    return discoverOIDC().then(function() {
      return fetch(oidc.tokenEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: redirectUri,
          client_id: clientId,
          code_verifier: verifier
        }).toString()
      });
    })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error(err.error_description || err.error || 'Token exchange failed'); });
      return r.json();
    })
    .then(function(tokens) {
      storageSet('tokens', {
        access_token: tokens.access_token,
        refresh_token: tokens.refresh_token,
        id_token: tokens.id_token,
        expires_at: Date.now() + (tokens.expires_in * 1000)
      });
      storageRemove('verifier');
      storageRemove('state');
      window.history.replaceState({}, '', redirectUri);
      return getUserInfo(tokens.access_token);
    })
    .then(function(user) {
      if (user) showLoggedIn(user);
      return user;
    })
    .catch(function(e) {
      console.error('OIDC callback error:', e);
      setAuthStatus('Auth failed: ' + e.message, true);
      window.history.replaceState({}, '', redirectUri);
      return null;
    });
  }

  window.signOut = function() {
    var tokens = storageGet('tokens');
    storageRemove('tokens');
    storageRemove('verifier');
    storageRemove('state');
    if (oidc.endSessionEndpoint && tokens && tokens.id_token) {
      var params = new URLSearchParams({
        id_token_hint: tokens.id_token,
        post_logout_redirect_uri: redirectUri
      });
      window.location.href = oidc.endSessionEndpoint + '?' + params;
      return;
    }
    showCard('logged-out-card');
    setAuthStatus('');
  };

  function init() {
    renderServiceCard('logged-out-services', false);
    renderServiceCard('logged-in-services', true);

    if (!authority) {
      setAuthStatus('Keycloak not configured.', true);
      return;
    }

    // Clean up stale OIDC state if there's no code in the URL
    // This prevents "invalid auth state" errors from leftover registration state
    var urlParams = new URLSearchParams(window.location.search);
    if (!urlParams.get('code') && !urlParams.get('error')) {
      storageRemove('verifier');
      storageRemove('state');
    }

    // 1. Handle OIDC callback (if returning from Keycloak)
    handleCallback().then(function(user) {
      if (user) return; // Already logged in via callback

      // 2. Check existing session tokens
      var tokens = storageGet('tokens');
      if (tokens && tokens.access_token) {
        if (tokens.expires_at && Date.now() > tokens.expires_at - 60000) {
          storageRemove('tokens');
          return;
        }
        return getUserInfo(tokens.access_token).then(function(user) {
          if (user) showLoggedIn(user);
        }).catch(function() {
          storageRemove('tokens');
        });
      }

      // 3. No tokens, no callback — just show the login screen
    });
  }

  init();
})();
</script>
<script>
(function() {
  var c = document.getElementById('stars-canvas');
  if (!c) return;
  var ctx = c.getContext('2d');
  var stars = [];
  function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
  function create() {
    stars = [];
    for (var i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height * 0.7,
        r: Math.random() * 1.5 + 0.3,
        speed: Math.random() * 0.02 + 0.005,
        phase: Math.random() * Math.PI * 2
      });
    }
  }
  function draw(t) {
    if (!ctx) return;
    ctx.clearRect(0, 0, c.width, c.height);
    stars.forEach(function(s) {
      var tw = 0.4 + 0.6 * Math.sin(t * s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,240,' + (tw * 0.8) + ')';
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', function() { resize(); create(); });
  resize();
  create();
  requestAnimationFrame(draw);
})();
</script>
</body>
